root = "."
tmp_dir = "tmp"

[build]
  cmd = "templ generate && go build -o ./tmp/varels_cms ./cmd/server"
  bin = "./tmp/varels_cms"
  include_ext = ["go", "templ", "sql", "html", "css"]
  exclude_dir = ["tmp", "bin", "data", "assets/css", "internal/db/sqlc", "docs", ".git"]
  delay = 300
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
