services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DB_PATH: /app/data/app.db
      BACKUP_DIR: /app/data/backups
    volumes:
      - varels-data:/app/data
    restart: unless-stopped

volumes:
  varels-data:
